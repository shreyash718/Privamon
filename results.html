<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privamon — Sanitized Screenshot</title>
  <link rel="stylesheet" href="results.css">
</head>
<body>
  <div class="app">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="logo-sm">
          <svg width="24" height="24" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="url(#g)"/>
            <path d="M14 7C10.13 7 7 10.13 7 14s3.13 7 7 7 7-3.13 7-7-3.13-7-7-7zm0 2.5a2 2 0 110 4 2 2 0 010-4zm0 9.5c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08s5.97 1.09 6 3.08A7.46 7.46 0 0114 19z" fill="white" opacity="0.9"/>
            <defs><linearGradient id="g" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
          </svg>
        </div>
        <h1>Privamon <span class="subtle">Sanitized Result</span></h1>
      </div>
      <div class="topbar-right">
        <label class="toggle-label">
          <input type="checkbox" id="toggleOverlay" checked>
          <span>Show detections</span>
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="toggleDom">
          <span>Show DOM</span>
        </label>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- Screenshot Panel -->
      <section class="screenshot-panel" id="screenshotPanel">
        <div class="screenshot-container" id="screenshotContainer">
          <canvas id="screenshotCanvas"></canvas>
          <div class="detection-overlays" id="detectionOverlays"></div>
          <div class="loading-state" id="loadingState">
            <div class="spinner-lg"></div>
            <p>Loading sanitized screenshot...</p>
          </div>
        </div>
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoomOut" title="Zoom out">−</button>
          <span class="zoom-level" id="zoomLevel">100%</span>
          <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
          <button class="zoom-btn" id="zoomFit" title="Fit to window">⊡</button>
        </div>
      </section>

      <!-- Side Panel -->
      <aside class="side-panel" id="sidePanel">
        <!-- Detection Summary -->
        <div class="panel-section">
          <h2 class="panel-title">Detection Summary</h2>
          <div class="summary-grid" id="summaryGrid">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Pipeline Timings -->
        <div class="panel-section">
          <h2 class="panel-title">Pipeline Timings</h2>
          <div class="timings-table" id="timingsTable">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Metadata -->
        <div class="panel-section">
          <h2 class="panel-title">Metadata</h2>
          <div class="metadata-list" id="metadataList">
            <!-- Populated by JS -->
          </div>
        </div>

        <!-- Sanitized DOM Viewer -->
        <div class="panel-section dom-section hidden" id="domSection">
          <h2 class="panel-title">Sanitized DOM</h2>
          <pre class="dom-viewer" id="domViewer"></pre>
        </div>
      </aside>
    </main>

    <!-- No Results State -->
    <div class="no-results hidden" id="noResults">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="20" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
        <path d="M24 16v8M24 28v.01" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <h2>No results available</h2>
      <p>Run the analysis from the extension popup first.</p>
    </div>
  </div>

  <script src="results.js"></script>
</body>
</html>
