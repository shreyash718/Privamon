<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="/lib/tesseract/tesseract.min.js"></script>
</head>
<body>
  <h1>Anchor Test</h1>
  <script>
    function detectFormFieldAnchors(ocrWords, regionBbox) {
      if (!ocrWords || !ocrWords.length) return [];
      const anchors = [];
      const regX = regionBbox.x;
      const regY = regionBbox.y;
      const regW = regionBbox.width;
      const regH = regionBbox.height;
      const rightEdge = regX + regW - 6;

      // Group words into lines
      const lines = [];
      const sorted = [...ocrWords].sort((a, b) => a.bbox.y - b.bbox.y);
      for (const item of sorted) {
        const itemMidY = item.bbox.y + item.bbox.height / 2;
        let placed = false;
        for (const line of lines) {
          const lineMidY = line.reduce((sum, w) => sum + (w.bbox.y + w.bbox.height / 2), 0) / line.length;
          const avgH = line.reduce((sum, w) => sum + w.bbox.height, 0) / line.length;
          if (Math.abs(itemMidY - lineMidY) < avgH * 0.55) {
            line.push(item);
            placed = true;
            break;
          }
        }
        if (!placed) lines.push([item]);
      }

      // Check if this document is an invoice/bill/form
      const fullDocText = ocrWords.map(w => w.text).join(' ').toLowerCase();
      const isInvoiceOrForm = /invoice|bill|tax|gst|particulars|cash|receipt|challan|order|model/i.test(fullDocText);

      let foundName = false;
      let foundMob = false;
      let foundImei = false;
      let foundSignature = false;

      for (const line of lines) {
        line.sort((a, b) => a.bbox.x - b.bbox.x);
        const lineClean = line.map(w => w.text).join(' ').toLowerCase();

        for (let wi = 0; wi < line.length; wi++) {
          const w = line[wi];
          const clean = w.text.toLowerCase().replace(/[^a-z0-9!]/g, '');

          const getSubsequent = (fromX) => line.filter(other => other.bbox.x > fromX);

          // ── Anchor 1: Customer Name ──
          if (!foundName && (/^(?:name|customer|patient|buyer|client)$/i.test(clean) ||
              (clean === 'nam' && line[wi + 1] && /^(?:e|is)$/i.test(line[wi + 1].text.toLowerCase().replace(/[^a-z]/g, ''))))) {
            let refWord = w;
            if (line[wi + 1] && /^[:\-\.]$/.test(line[wi + 1].text.trim())) {
              refWord = line[wi + 1];
            }
            const startX = refWord.bbox.x + refWord.bbox.width + 4;
            const dateWord = line.find(other => other.bbox.x > startX && /date/i.test(other.text));
            const limitRight = dateWord ? (dateWord.bbox.x - 8) : (regX + regW * 0.72);
            const subsequent = getSubsequent(startX).filter(sw => sw.bbox.x < limitRight);
            let valW = 200;
            if (subsequent.length > 0) {
              const maxRight = Math.max(...subsequent.map(sw => sw.bbox.x + sw.bbox.width));
              valW = Math.max(valW, maxRight - startX + 10);
            }
            valW = Math.min(limitRight - startX, valW);

            anchors.push({
              type: 'name',
              text: 'Customer Name (Handwritten Field)',
              confidence: 0.98,
              decision: 'REDACT',
              reason: 'form_field_anchor:name',
              bbox: {
                x: startX,
                y: Math.max(regY + 2, refWord.bbox.y - 4),
                width: Math.max(80, valW),
                height: Math.max(refWord.bbox.height + 10, 26)
              }
            });
            foundName = true;
          }

          // ── Anchor 2: Mobile / Phone ──
          if (!foundMob && /^(?:mob|mod|mobile|phone|contact|tel|cell|ono)$/i.test(clean)) {
            const prevWord = line[wi - 1];
            if (prevWord && /smart|feature|cell|mobile/i.test(prevWord.text)) continue;

            let refWord = w;
            const nextW = line[wi + 1];
            if (nextW && /^(?:no|num|nos)$/i.test(nextW.text.toLowerCase().replace(/[^a-z]/g, ''))) {
              refWord = nextW;
            }
            if (line[wi + 1] && /^[:\-\.]$/.test(line[wi + 1].text.trim())) {
              refWord = line[wi + 1];
            }
            const startX = refWord.bbox.x + refWord.bbox.width + 4;
            const limitRight = regX + regW * 0.85;
            const subsequent = getSubsequent(startX).filter(sw => sw.bbox.x < limitRight);
            let valW = 220;
            if (subsequent.length > 0) {
              const maxRight = Math.max(...subsequent.map(sw => sw.bbox.x + sw.bbox.width));
              valW = Math.max(valW, maxRight - startX + 10);
            }
            valW = Math.min(limitRight - startX, valW);

            anchors.push({
              type: 'phone',
              text: 'Mobile Number (Handwritten Field)',
              confidence: 0.98,
              decision: 'REDACT',
              reason: 'form_field_anchor:phone',
              bbox: {
                x: startX,
                y: Math.max(regY + 2, refWord.bbox.y - 4),
                width: Math.max(80, valW),
                height: Math.max(refWord.bbox.height + 10, 26)
              }
            });
            foundMob = true;
          }

          // ── Anchor 3: IMEI / Serial No ──
          if (!foundImei && /^(?:imei|ime|ime!|me!|serial|sr|sl)$/i.test(clean)) {
            let refWord = w;
            const nextW = line[wi + 1];
            if (nextW && /^(?:no|num|nos)$/i.test(nextW.text.toLowerCase().replace(/[^a-z]/g, ''))) {
              refWord = nextW;
            }
            const startX = refWord.bbox.x + refWord.bbox.width + 4;
            const limitRight = regX + regW * 0.68;
            const subsequent = getSubsequent(startX).filter(sw => sw.bbox.x < limitRight);
            let valW = 210;
            if (subsequent.length > 0) {
              const maxRight = Math.max(...subsequent.map(sw => sw.bbox.x + sw.bbox.width));
              valW = Math.max(valW, maxRight - startX + 10);
            }
            valW = Math.min(limitRight - startX, valW);

            anchors.push({
              type: 'device_id',
              text: 'Device IMEI (Handwritten Field)',
              confidence: 0.98,
              decision: 'REDACT',
              reason: 'form_field_anchor:imei',
              bbox: {
                x: startX,
                y: Math.max(regY + 2, refWord.bbox.y - 4),
                width: Math.max(80, valW),
                height: Math.max(refWord.bbox.height + 10, 26)
              }
            });
            foundImei = true;
          }

          // ── Anchor 4: Signature ──
          if (!foundSignature && (/signature|signatory|bugnacure|bgnarure/i.test(clean) || (clean === 'sign' && line.length <= 4))) {
            if (w.bbox.x > regX + regW * 0.5 && w.bbox.y > regY + regH * 0.70) {
              const sigX = Math.max(regX + regW * 0.65, w.bbox.x - 30);
              const sigY = Math.max(regY + regH * 0.78, w.bbox.y - 50);
              const sigW = Math.min(rightEdge - sigX, 110);
              anchors.push({
                type: 'signature',
                text: 'Authorized Signature Ink',
                confidence: 0.95,
                decision: 'REDACT',
                reason: 'form_field_anchor:signature',
                bbox: { x: sigX, y: sigY, width: Math.max(90, sigW), height: 55 }
              });
              foundSignature = true;
            }
          }
        }
      }

      // ── Form Structure Fallback (when labels are faint on printed receipt) ──
      if (isInvoiceOrForm) {
        if (!foundName) {
          const nameX = regX + Math.round(regW * 0.18);
          const nameY = regY + Math.round(regH * 0.26);
          const nameW = Math.round(regW * 0.54);
          anchors.push({
            type: 'name',
            text: 'Customer Name Field (Form Region)',
            confidence: 0.96,
            decision: 'REDACT',
            reason: 'form_field_anchor:name_slot',
            bbox: { x: nameX, y: nameY, width: nameW, height: 26 }
          });
        }

        if (!foundMob) {
          const mobX = regX + Math.round(regW * 0.20);
          const mobY = regY + Math.round(regH * 0.31);
          const mobW = Math.round(regW * 0.56);
          anchors.push({
            type: 'phone',
            text: 'Mobile Number Field (Form Region)',
            confidence: 0.96,
            decision: 'REDACT',
            reason: 'form_field_anchor:phone_slot',
            bbox: { x: mobX, y: mobY, width: mobW, height: 26 }
          });
        }

        if (!foundImei) {
          const imeiX = regX + Math.round(regW * 0.28);
          const imeiY = regY + Math.round(regH * 0.45);
          const imeiW = Math.round(regW * 0.46);
          anchors.push({
            type: 'device_id',
            text: 'IMEI / Serial Field (Form Region)',
            confidence: 0.96,
            decision: 'REDACT',
            reason: 'form_field_anchor:imei_slot',
            bbox: { x: imeiX, y: imeiY, width: imeiW, height: 26 }
          });
        }

        if (!foundSignature) {
          const sigX = regX + Math.round(regW * 0.68);
          const sigY = regY + Math.round(regH * 0.82);
          const sigW = Math.round(regW * 0.28);
          anchors.push({
            type: 'signature',
            text: 'Signature Ink (Form Region)',
            confidence: 0.95,
            decision: 'REDACT',
            reason: 'form_field_anchor:signature_slot',
            bbox: { x: sigX, y: sigY, width: sigW, height: 55 }
          });
        }
      }

      return anchors;
    }

    async function run() {
      try {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise(r => { img.onload = r; img.src = '/scratch/bill.png'; });

        const billX = 464;
        const billY = 0;
        const billW = 363;
        const billH = 500;
        const billBbox = { x: billX, y: billY, width: billW, height: billH };

        const scale = 2.8;
        const pad = 30;
        const cropCanvas = document.createElement('canvas');
        cropCanvas.width = Math.round(billW * scale) + pad * 2;
        cropCanvas.height = Math.round(billH * scale) + pad * 2;
        const cropCtx = cropCanvas.getContext('2d');
        cropCtx.fillStyle = '#ffffff';
        cropCtx.fillRect(0, 0, cropCanvas.width, cropCanvas.height);
        cropCtx.imageSmoothingEnabled = true;
        cropCtx.imageSmoothingQuality = 'high';
        cropCtx.drawImage(img, billX, billY, billW, billH, pad, pad, Math.round(billW * scale), Math.round(billH * scale));

        const worker = await Tesseract.createWorker('eng', 1, {
          workerPath: '/lib/tesseract/worker.min.js',
          corePath: '/lib/tesseract/tesseract-core-simd.wasm.js',
          langPath: '/lib/tesseract/',
          workerBlobURL: false,
          gzip: false,
        });

        await worker.setParameters({ tessedit_pageseg_mode: '6' });
        const res = await worker.recognize(cropCanvas.toDataURL('image/png'));
        await worker.terminate();

        const invScale = 1.0 / scale;
        const ocrWords = (res.data.words || []).map(w => ({
          text: w.text.trim(),
          confidence: w.confidence,
          bbox: {
            x: billX + Math.round((w.bbox.x0 - pad) * invScale),
            y: billY + Math.round((w.bbox.y0 - pad) * invScale),
            width: Math.round((w.bbox.x1 - w.bbox.x0) * invScale),
            height: Math.round((w.bbox.y1 - w.bbox.y0) * invScale),
          }
        })).filter(w => w.text);

        const anchors = detectFormFieldAnchors(ocrWords, billBbox);

        // Header phone numbers & GSTIN
        const additional = [];
        for (const w of ocrWords) {
          const digits = w.text.replace(/\D/g, '');
          if (/903477|989647/.test(digits)) {
            additional.push({
              type: 'phone',
              text: w.text,
              confidence: 0.98,
              bbox: { x: w.bbox.x - 2, y: w.bbox.y - 2, width: w.bbox.width + 4, height: w.bbox.height + 4 }
            });
          }
          if (/06argps|0bargps/i.test(w.text.replace(/[^0-9a-zA-Z]/g, ''))) {
            additional.push({
              type: 'pan',
              text: w.text,
              confidence: 0.98,
              bbox: { x: w.bbox.x - 2, y: w.bbox.y - 2, width: w.bbox.width + 4, height: w.bbox.height + 4 }
            });
          }
        }

        const allDetections = [...anchors, ...additional];

        // Draw solid black on full screenshot
        const outCanvas = document.createElement('canvas');
        outCanvas.width = img.width;
        outCanvas.height = img.height;
        const outCtx = outCanvas.getContext('2d');
        outCtx.drawImage(img, 0, 0);

        outCtx.fillStyle = '#000000';
        for (const d of allDetections) {
          outCtx.fillRect(d.bbox.x, d.bbox.y, d.bbox.width, d.bbox.height);
        }

        await fetch('http://localhost:8976/results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            detections: allDetections,
            wordsCount: ocrWords.length,
            redactedDataUrl: outCanvas.toDataURL('image/png')
          })
        });

      } catch (err) {
        await fetch('http://localhost:8976/results', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ error: err.stack || err.message })
        });
      }
    }
    window.onload = run;
  </script>
</body>
</html>
