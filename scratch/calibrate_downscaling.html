<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Privamon — Pre-Transmission Downscaling Calibration Suite</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --border: #334155;
      --success: #10b981;
    }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 0;
      margin-bottom: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card.highlight {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title {
      font-size: 15px;
      font-weight: 700;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
    }
    .badge.default {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      font-weight: 600;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(0,0,0,0.25);
      padding: 10px;
      border-radius: 6px;
    }
    .metrics span b {
      color: var(--text);
    }
    .preview-container {
      width: 100%;
      height: 180px;
      background: #000;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .preview-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .crops-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .crops-row {
      display: flex;
      gap: 8px;
    }
    .crop-box {
      flex: 1;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px;
      text-align: center;
    }
    .crop-box img {
      image-rendering: pixelated;
      width: 100%;
      height: 60px;
      object-fit: contain;
    }
    .crop-label {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Privamon — Pre-Transmission Downscaling Calibration Suite</h1>
  <p class="subtitle">Empirical validation using browser-native <code>createImageBitmap</code> and <code>Canvas</code> high-quality resampling.</p>

  <div id="status">Generating calibration sets across candidate sizes [1536, 1152, 896, 640]...</div>
  <div class="grid" id="calibrationGrid"></div>

  <!-- Include ImageResizer -->
  <script src="../privacy/image-resizer.js"></script>
  <script>
    (async () => {
      const statusEl = document.getElementById('status');
      const gridEl = document.getElementById('calibrationGrid');

      // Create a synthetic high-DPI test UI canvas with 12px, 14px, and 16px text labels
      function createTestUiCanvas() {
        const c = document.createElement('canvas');
        // Simulated 2x Retina Display (2560 x 1440)
        c.width = 2560;
        c.height = 1440;
        const ctx = c.getContext('2d');

        // Background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);

        // Header
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, c.width, 140);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px sans-serif';
        ctx.fillText('Privamon Test Application Portal', 60, 85);

        // Card Container
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(60, 200, 1600, 1000);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 4;
        ctx.strokeRect(60, 200, 1600, 1000);

        // Form Fields (12px - 14px CSS equivalent text at 2x = 24px - 28px physical)
        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 28px sans-serif'; // 14px CSS
        ctx.fillText('Username / Email Address:', 100, 280);

        // Input Box
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(100, 310, 800, 80);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 2;
        ctx.strokeRect(100, 310, 800, 80);
        ctx.fillStyle = '#64748b';
        ctx.font = '24px sans-serif'; // 12px CSS placeholder
        ctx.fillText('user.account@example.com (Placeholder)', 120, 360);

        // Redacted Black Box
        ctx.fillStyle = '#000000';
        ctx.fillRect(100, 440, 800, 80);

        // Button 1: Submit Action
        ctx.fillStyle = '#6366f1';
        ctx.fillRect(100, 560, 320, 90);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 28px sans-serif'; // 14px CSS
        ctx.fillText('Sign In Securely', 140, 615);

        // Button 2: Secondary 12px text
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(450, 560, 260, 90);
        ctx.fillStyle = '#334155';
        ctx.font = 'bold 24px sans-serif'; // 12px CSS
        ctx.fillText('Cancel Action', 480, 615);

        // Table with 13px CSS (26px physical)
        ctx.fillStyle = '#0f172a';
        ctx.font = '26px monospace';
        ctx.fillText('Order #849204 | Status: Completed | Amount: $149.99', 100, 750);
        ctx.fillText('Item: Privacy Subscription Plan (Annual Renewal)', 100, 810);

        return c;
      }

      const testCanvas = createTestUiCanvas();
      const dpr = 2.0; // Simulated Retina

      const candidateSizes = [1536, 1152, 896, 640];
      const results = await Privamon.ImageResizer.generateCalibrationSet(testCanvas, dpr, candidateSizes);

      statusEl.textContent = `Completed evaluation across ${results.length} candidate long-edge sizes. Showing browser-native resampling results:`;

      results.forEach(item => {
        const isDefault = item.targetLongEdge === Privamon.ImageResizer.DEFAULT_MAX_SERVER_LONG_EDGE;
        const card = document.createElement('div');
        card.className = `card ${isDefault ? 'highlight' : ''}`;

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${item.targetLongEdge}px Max Long Edge</span>
            <span class="badge ${isDefault ? 'default' : ''}">${isDefault ? '★ RECOMMENDED DEFAULT' : 'Candidate Size'}</span>
          </div>
          <div class="metrics">
            <span>Dimensions: <b>${item.dimensions.width} x ${item.dimensions.height}</b></span>
            <span>Est. Size: <b>${item.kilobytes} KB</b> (PNG)</span>
            <span>Aspect Ratio: <b>${(item.dimensions.width / item.dimensions.height).toFixed(3)}</b> (Preserved)</span>
            <span>VLM Visual Tokens: <b>~${Math.round((item.dimensions.width * item.dimensions.height) / (28*28))}</b> tokens</span>
          </div>
          <div class="preview-container">
            <img src="${item.dataUrl}" alt="${item.targetLongEdge}px preview">
          </div>
          <div class="crops-title">Text Sharpness Crops (100% Zoom):</div>
          <div class="crops-row">
            <div class="crop-box">
              <img class="crop-btn" src="" alt="Button text crop">
              <div class="crop-label">14px Label</div>
            </div>
            <div class="crop-box">
              <img class="crop-input" src="" alt="Input text crop">
              <div class="crop-label">12px Placeholder</div>
            </div>
          </div>
        `;

        // Render crops from canvas
        const ctx = item.canvas.getContext('2d');
        const scale = item.dimensions.width / (testCanvas.width / dpr);

        // Crop 1: Sign In button text (original CSS coords ~ 100/2 to 420/2, 560/2 to 650/2)
        const crop1 = document.createElement('canvas');
        crop1.width = Math.round(180 * scale);
        crop1.height = Math.round(60 * scale);
        crop1.getContext('2d').drawImage(
          item.canvas,
          Math.round(60 * scale), Math.round(285 * scale), crop1.width, crop1.height,
          0, 0, crop1.width, crop1.height
        );
        card.querySelector('.crop-btn').src = crop1.toDataURL();

        // Crop 2: Input placeholder text
        const crop2 = document.createElement('canvas');
        crop2.width = Math.round(260 * scale);
        crop2.height = Math.round(50 * scale);
        crop2.getContext('2d').drawImage(
          item.canvas,
          Math.round(60 * scale), Math.round(165 * scale), crop2.width, crop2.height,
          0, 0, crop2.width, crop2.height
        );
        card.querySelector('.crop-input').src = crop2.toDataURL();

        gridEl.appendChild(card);
      });

      console.log('[Calibration] Browser calibration set generated successfully.');
    })();
  </script>
</body>
</html>
