<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Standalone WebGPU ONNX Test - Simplified Models</title>
  <script src="../lib/onnx/ort.min.js"></script>
</head>
<body>
  <h1>WebGPU ONNX Runtime Test - Simplified Models</h1>
  <pre id="log" style="background:#111; color:#0f0; padding:15px; font-family:monospace; font-size:14px; white-space:pre-wrap;"></pre>

  <script>
    function log(msg, type = 'info') {
      const el = document.getElementById('log');
      const text = `[${type.toUpperCase()}] ${msg}\n`;
      el.textContent += text;
      if (type === 'error') console.error(msg);
      else console.log(msg);
    }

    async function runTest() {
      log('Starting WebGPU ONNX Runtime Test for Simplified Models...');

      if (typeof ort !== 'undefined') {
        ort.env.debug = true;
        ort.env.logLevel = 'verbose';
        log(`ONNX Runtime Web loaded. Version: ${ort.version || '1.29.0'}`);
      } else {
        log('ERROR: ort is undefined!', 'error');
        return;
      }

      const modelsToTest = [
        '../lib/onnx/version-RFB-320-simplified.onnx',
        '../lib/onnx/blazeface-simplified.onnx'
      ];

      for (const modelUrl of modelsToTest) {
        log(`\n----------------------------------------`);
        log(`Testing simplified model: ${modelUrl}`);
        try {
          const resp = await fetch(modelUrl);
          if (!resp.ok) {
            log(`Failed to fetch ${modelUrl}: ${resp.status} ${resp.statusText}`, 'error');
            continue;
          }
          const buffer = await resp.arrayBuffer();
          log(`Model loaded into memory. Byte size: ${buffer.byteLength}`);

          // TEST WEBGPU ONLY
          log(`Attempting InferenceSession.create with executionProviders: ['webgpu'] (STRICT WEBGPU ONLY)...`);
          const t0 = performance.now();
          let session = null;
          try {
            session = await ort.InferenceSession.create(buffer, {
              executionProviders: ['webgpu'],
              graphOptimizationLevel: 'all'
            });
            const tCreate = performance.now() - t0;
            log(`SUCCESS: WebGPU InferenceSession created in ${tCreate.toFixed(2)} ms!`, 'info');
            log(`Session Input Names: ${JSON.stringify(session.inputNames)}`);
            log(`Session Output Names: ${JSON.stringify(session.outputNames)}`);

            // Run sample inference
            const sampleData = new Float32Array(1 * 3 * 240 * 320).fill(0.5);
            const inputTensor = new ort.Tensor('float32', sampleData, [1, 3, 240, 320]);
            const feeds = {};
            feeds[session.inputNames[0]] = inputTensor;

            log(`Running WebGPU inference with tensor [1, 3, 240, 320]...`);
            
            // Warmup
            await session.run(feeds);

            // 10 Runs Benchmark
            const times = [];
            let lastResults = null;
            for (let i = 0; i < 10; i++) {
              const tInf0 = performance.now();
              lastResults = await session.run(feeds);
              times.push(performance.now() - tInf0);
            }
            const avg = times.reduce((a, b) => a + b, 0) / times.length;
            const min = Math.min(...times);
            const max = Math.max(...times);
            log(`SUCCESS: WebGPU inference completed! Avg=${avg.toFixed(2)} ms (Min=${min.toFixed(2)} ms, Max=${max.toFixed(2)} ms)`, 'info');
            for (const outName of session.outputNames) {
              const outT = lastResults[outName];
              log(`Output '${outName}': shape=[${outT.dims.join(',')}], data length=${outT.data.length}`);
            }

          } catch (webgpuErr) {
            log(`WEBGPU FAILURE DETECTED ON SIMPLIFIED MODEL!`, 'error');
            log(`Error Name: ${webgpuErr.name}`, 'error');
            log(`Error Message: ${webgpuErr.message}`, 'error');
            log(`Stack: ${webgpuErr.stack}`, 'error');
          }

        } catch (err) {
          log(`General test failure for ${modelUrl}: ${err.message}`, 'error');
        }
      }

      log('\n========================================');
      log('TEST COMPLETE.');
    }

    window.addEventListener('DOMContentLoaded', runTest);
  </script>
</body>
</html>
